name: Build AuroraTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out AuroraTV source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test smart language filtering and library behavior
        run: |
          mkdir -p build/core-tests
          javac -d build/core-tests app/src/main/java/tv/aurora/player/LibraryCore.java tests/CoreTest.java
          java -cp build/core-tests CoreTest
          javac -cp build/core-tests -d build/core-tests app/src/main/java/tv/aurora/player/GuideName.java tests/GuideNameTest.java
          java -cp build/core-tests GuideNameTest
          javac -cp build/core-tests -d build/core-tests app/src/main/java/tv/aurora/player/PlaybackTuning.java tests/PlaybackTuningTest.java
          java -cp build/core-tests PlaybackTuningTest
          javac -cp build/core-tests -d build/core-tests app/src/main/java/tv/aurora/player/TvLayout.java tests/TvLayoutTest.java
          java -cp build/core-tests TvLayoutTest

      - name: Build signed debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload AuroraTV APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
