name: Build AuroraTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out AuroraTV source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners include Android SDK command-line tools.
      # Avoid android-actions/setup-android@v3, which currently tries to
      # install the removed legacy SDK package named "tools".
      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload AuroraTV APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
