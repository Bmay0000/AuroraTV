name: Build Flutter AuroraTV 2.0 APK

on:
  push:
    branches: [flutter-rewrite]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-flutter:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name aurora_tv --org tv.aurora --no-pub .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text=text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          text=text.replace('<application', '<application android:usesCleartextTraffic="true"',1)
          p.write_text(text)
          # Separate app ID until migration is validated on a real Fire TV.
          import re
          gradle=Path('android/app/build.gradle.kts')
          if gradle.exists():
              v=gradle.read_text().replace('applicationId = "tv.aurora.aurora_tv"','applicationId = "tv.aurora.flutterpreview"')
              gradle.write_text(v)
          PY
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Check Dart syntax and static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter unit tests
        working-directory: flutter_app
        run: flutter test
      - name: Build installable Android APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - name: Upload Flutter AuroraTV APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-Flutter-2.0-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
