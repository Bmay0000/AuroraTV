name: Publish existing Rust Preview APK
on:
  push:
    branches: [rust-rebuild-foundation]
    paths: ['.github/workflows/publish-preview-existing.yml']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download successful Rust build
        uses: actions/download-artifact@v4
        with:
          name: AuroraTV-RustCore-debug-APK
          run-id: 42501219204
          repository: Bmay0000/AuroraTV
          github-token: ${{ github.token }}
          path: dist
      - name: Rename and verify standalone APK
        run: |
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/AuroraTV-Rust-Preview.apk
          cd dist
          sha256sum AuroraTV-Rust-Preview.apk > SHA256SUMS.txt
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '# AuroraTV Rust Preview' '' 'Experimental native-Rust backed APK with existing Android UI. Not yet tested on actual Fire TV hardware.' '' 'The APK was built and tested by GitHub Actions run 42501219204. Download the APK under Assets.' > dist/NOTES.md
          if gh release view rust-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload rust-preview dist/AuroraTV-Rust-Preview.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create rust-preview dist/AuroraTV-Rust-Preview.apk dist/SHA256SUMS.txt --target main --title 'AuroraTV Rust Preview (experimental)' --notes-file dist/NOTES.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
