[package]
name = "aurora-tv"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "aurora_tv"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aurora-tv-desktop"
path = "src/main.rs"

[dependencies]
aurora-core = { path = "../core" }
slint = { version = "=1.18.1", features = ["backend-android-activity-06"] }
serde_json = "1"
ureq = "2.12"
url = "2.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "=1.18.1"

[package.metadata.android]
package = "tv.aurora.rust"
apk_name = "AuroraTV-Rust-Preview"
build_targets = ["aarch64-linux-android"]
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 32

[package.metadata.android.application]
label = "AuroraTV Rust"
uses_cleartext_traffic = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
orientation = "landscape"
config_changes = "orientation|keyboardHidden|screenSize"
launch_mode = "singleTask"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "aurora_tv"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "android.intent.category.LEANBACK_LAUNCHER"]

[[package.metadata.android.application.activity]]
name = "tv.aurora.rust.PlayerActivity"
exported = false
orientation = "landscape"
config_changes = "orientation|keyboardHidden|screenSize"
